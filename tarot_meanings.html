    function renderCards(filter = 'all') {
      grid.innerHTML = '';
      const filteredCards = filter === 'all' ? tarotMeanings : tarotMeanings.filter(card => card.suit === filter);

      filteredCards.forEach(card => {
        const cardElement = document.createElement('div');
        cardElement.className = 'tarot-card-item rounded-lg overflow-hidden shadow-lg';
        cardElement.innerHTML = `
          <img src="${card.img}" alt="${card.name}" class="w-full h-auto object-cover">
          <div class="p-2 bg-black/20">
            <h3 class="text-white font-semibold text-sm truncate">${card.name}</h3>
          </div>
        `;
        cardElement.addEventListener('click', () => openModal(card));
        grid.appendChild(cardElement);
      });
    }

            <h3 class="font-bold text-xl text-emerald-300">การเงิน</h3>
            <p><strong class="text-white/90">ไพ่ตั้งตรง:</strong> <span class="text-white/80">${card.upright_finance}</span></p>
            <p><strong class="text-white/90">ไพ่กลับหัว:</strong> <span class="text-white/80">${card.reversed_finance}</span></p>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
      setTimeout(() => { modal.style.opacity = 1; }, 10);
    }
    
    function closeModal() {
        modal.style.opacity = 0;
        setTimeout(() => { modal.style.display = 'none'; }, 300);
    }

    filterContainer.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        document.querySelector('.filter-btn.active').classList.remove('active');
        e.target.classList.add('active');
        const filter = e.target.dataset.filter;
        renderCards(filter);
      }
    });
    
    // Modal closing events
    modalCloseBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closeModal();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.style.display === 'flex') {
            closeModal();
        }
    });

    // Initial render
    renderCards();
  </script>
</body>
</html>
