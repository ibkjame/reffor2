  <style>
    body{font-family:'Noto Sans Thai',sans-serif;background:linear-gradient(135deg,#9E63BF 0%,#764ba2 100%);color:#fff;overflow-x:hidden}
    .space-bg{background:linear-gradient(135deg,#9E63BF 0%,#764ba2 50%,#f093fb 100%);background-size:400% 400%;animation:gradientShift 15s ease infinite;position:fixed;inset:0;z-index:-3}
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .stars{position:fixed;inset:0;background:transparent url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/stars.png) repeat top center;z-index:-2}
    .twinkling{position:fixed;inset:0;background:transparent url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/stars.png) repeat top center;z-index:-1;animation:move-twinkle-back 300s linear infinite;opacity:.4}
    @keyframes move-twinkle-back{from{background-position:0 0}to{background-position:-10000px 5000px}}

    .glass-box{background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.05));backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.1);transition:transform .4s ease,box-shadow .4s ease;overflow:hidden}
    .glass-box-flat{background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.05));backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.1)}
    .text-glow{text-shadow:0 0 20px rgba(255,255,255,.5),0 0 40px rgba(167,139,250,.3)}

    .filter-btn{transition:all .3s ease;background-color:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
    .filter-btn.active,.filter-btn:hover{background-color:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
    .tarot-card-item{cursor:pointer;transition:transform .3s ease, box-shadow .3s ease}
    .tarot-card-item:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(0,0,0,.3)}

    .modal-bg{position:fixed;inset:0;background:rgba(30,21,80,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease;padding:1rem}
    .modal-panel{background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.25);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.2);padding:2rem;width:100%;max-width:900px;position:relative;max-height:95vh;overflow-y:auto}
    .modal-close{position:absolute;top:1rem;right:1rem;font-size:2.5rem;color:rgba(255,255,255,.6);cursor:pointer;transition:all .2s;z-index:100}
    .modal-close:hover{color:#fff;transform:rotate(90deg) scale(1.1)}
    .modal-panel::-webkit-scrollbar{width:8px}
    .modal-panel::-webkit-scrollbar-track{background:rgba(0,0,0,.2);border-radius:10px}
    .modal-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:10px}
    .modal-panel::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.5)}
  </style>
</head>
<body class="antialiased">
  <div class="space-bg"></div>
  <div class="stars"></div>
  <div class="twinkling"></div>

  <div class="relative min-h-screen p-4 sm:p-6 md:p-8">
    <main class="w-full max-w-7xl mx-auto text-center">
      <header class="py-8">
        <h1 class="text-4xl md:text-5xl font-bold text-white text-glow">ห้องสมุดไพ่ทาโรต์</h1>
        <p class="text-white/80 mt-2 text-lg">ค้นหาความหมายของไพ่ทั้ง 78 ใบ</p>
      </header>

      <!-- Filter -->
      <nav id="filter-container" class="glass-box-flat p-4 my-8 flex flex-wrap items-center justify-center gap-2 md:gap-4">
        <button class="filter-btn active font-semibold px-4 py-2 rounded-lg" data-filter="all">ทั้งหมด</button>
        <button class="filter-btn font-semibold px-4 py-2 rounded-lg" data-filter="major">Major Arcana</button>
        <button class="filter-btn font-semibold px-4 py-2 rounded-lg" data-filter="wands">ไพ่ไม้ (Wands)</button>
        <button class="filter-btn font-semibold px-4 py-2 rounded-lg" data-filter="cups">ไพ่ถ้วย (Cups)</button>
        <button class="filter-btn font-semibold px-4 py-2 rounded-lg" data-filter="swords">ไพ่ดาบ (Swords)</button>
        <button class="filter-btn font-semibold px-4 py-2 rounded-lg" data-filter="pentacles">ไพ่เหรียญ (Pentacles)</button>
      </nav>

      <!-- Grid -->
      <section id="tarot-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-4 md:gap-6">
        <!-- injected -->
      </section>

      <a href="/" class="inline-block mt-12 glass-box-flat px-6 py-3 font-semibold hover:bg-white/10 transition">กลับสู่หน้าหลัก</a>
    </main>
  </div>

  <!-- Modal -->
  <div id="card-modal" class="modal-bg" style="display:none; opacity:0;">
    <div id="modal-panel" class="modal-panel">
      <span id="modal-close-btn" class="modal-close" aria-label="ปิด">&times;</span>
      <div id="modal-content" class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        <!-- injected -->
      </div>
    </div>
  </div>

  <!-- App: ใช้ข้อมูลจาก /tarot-data.js -->
  <script type="module">
    // 1) โหลดข้อมูล 78 ใบจากไฟล์ภายนอก (คุณจะสร้างไฟล์นี้เอง)
    // ไฟล์ /tarot-data.js ต้อง export ตัวแปร: export const tarotMeanings = [ ... ];
    import { tarotMeanings } from './tarot-data.js';

    // 2) (ออปชัน) เติม meta แบบอัตโนมัติ: element / Yes-No / timing / astro / numerology / advice
    const SUIT_ELEMENT = { major:'Spirit', wands:'Fire', cups:'Water', swords:'Air', pentacles:'Earth' };
    const YESNO_MAJOR = { 'The Fool':'Maybe','The Magician':'Yes','The High Priestess':'Maybe','The Empress':'Yes','The Emperor':'Yes','The Hierophant':'Yes','The Lovers':'Yes','The Chariot':'Yes','Strength':'Yes','The Hermit':'Maybe','Wheel of Fortune':'Yes','Justice':'Maybe','The Hanged Man':'No','Death':'No','Temperance':'Yes','The Devil':'No','The Tower':'No','The Star':'Yes','The Moon':'Maybe','The Sun':'Yes','Judgement':'Yes','The World':'Yes' };
    const YESNO_SUIT = { wands:'Yes', cups:'Yes', swords:'No', pentacles:'Yes', major:'Maybe' };
    const SUIT_TIMING = { wands:'Spring • Weeks', cups:'Summer • Months', swords:'Autumn • Days', pentacles:'Winter • Months/Seasons', major:'Divine timing' };
    const MAJOR_ASTRO = {
      'The Fool':{planet:'Uranus',num:0},'The Magician':{planet:'Mercury',num:1},'The High Priestess':{planet:'Moon',num:2},
      'The Empress':{planet:'Venus',num:3},'The Emperor':{sign:'Aries',num:4},'The Hierophant':{sign:'Taurus',num:5},
      'The Lovers':{sign:'Gemini',num:6},'The Chariot':{sign:'Cancer',num:7},'Strength':{sign:'Leo',num:8},
      'The Hermit':{sign:'Virgo',num:9},'Wheel of Fortune':{planet:'Jupiter',num:10},'Justice':{sign:'Libra',num:11},
      'The Hanged Man':{planet:'Neptune',num:12},'Death':{sign:'Scorpio',num:13},'Temperance':{sign:'Sagittarius',num:14},
      'The Devil':{sign:'Capricorn',num:15},'The Tower':{planet:'Mars',num:16},'The Star':{sign:'Aquarius',num:17},
      'The Moon':{sign:'Pisces',num:18},'The Sun':{planet:'Sun',num:19},'Judgement':{planet:'Pluto',num:20},'The World':{planet:'Saturn',num:21}
    };
    const NUM = {0:'ศักยภาพ',1:'เริ่ม',2:'สมดุล',3:'เติบโต',4:'โครงสร้าง',5:'เปลี่ยน',6:'กลมกลืน',7:'ค้นหา',8:'พลัง',9:'ปิดวงจร',10:'วงจรใหม่'};

    function enhance(cards){
      return cards.map(c=>{
        const element = SUIT_ELEMENT[c.suit];
        const yesno = c.suit==='major' ? (YESNO_MAJOR[c.name]||'Maybe') : YESNO_SUIT[c.suit];
        const timing = SUIT_TIMING[c.suit];
        const astro  = c.suit==='major' ? MAJOR_ASTRO[c.name] : undefined;
        const numerology = c.suit==='major'
          ? { number: astro?.num, theme: NUM[astro?.num??0] }
          : (()=>{
              const map={Ace:1,Two:2,Three:3,Four:4,Five:5,Six:6,Seven:7,Eight:8,Nine:9,Ten:10};
              const key=Object.keys(map).find(k=>c.name.startsWith(k));
              return key?{number:map[key],theme:NUM[map[key]]}:undefined;
            })();
        const keywords = Array.from(new Set([ c.name, ...c.upright_general.split(',').map(s=>s.trim()).slice(0,5), element ])).slice(0,8);
        return {...c, element, yesno, timing, astrology:astro, numerology, keywords };
      });
    }

    const TAROT = enhance(tarotMeanings);

    // 3) DOM refs
    const grid = document.getElementById('tarot-grid');
    const filterContainer = document.getElementById('filter-container');
    const modal = document.getElementById('card-modal');
    const modalContent = document.getElementById('modal-content');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalPanel = document.getElementById('modal-panel');

    // 4) Render list
    function renderCards(filter='all'){
      grid.innerHTML='';
      const cards = filter==='all'?TAROT:TAROT.filter(c=>c.suit===filter);
      cards.forEach(card=>{
        const el=document.createElement('div');
        el.className='tarot-card-item rounded-lg overflow-hidden shadow-lg bg-black/20';
        el.innerHTML=`
          <img loading="lazy" src="${card.img}" alt="${card.name}" class="w-full h-auto object-cover">
          <div class="p-2">
            <h3 class="text-white font-semibold text-sm truncate">${card.name}</h3>
            <p class="text-[11px] text-white/70 mt-1">${card.element}${card.yesno?` • ${card.yesno}`:''}${card.timing?` • ${card.timing}`:''}</p>
          </div>`;
        el.addEventListener('click',()=>openModal(card));
        grid.appendChild(el);
      });
    }

    // 5) Modal
    function openModal(card){
      modalPanel.scrollTop=0;
      modalContent.innerHTML=`
        <div class="text-center">
          <img src="${card.img}" alt="${card.name}" class="w-full max-w-xs mx-auto rounded-xl shadow-2xl">
          <h2 class="text-3xl font-bold mt-4 text-glow">${card.name}</h2>
          <div class="mt-2 text-sm text-white/80 flex flex-wrap gap-2 justify-center">
            <span class="px-2 py-1 rounded-full bg-white/10">${card.element}</span>
            ${card.yesno?`<span class="px-2 py-1 rounded-full bg-white/10">Yes/No: ${card.yesno}</span>`:''}
            ${card.timing?`<span class="px-2 py-1 rounded-full bg-white/10">${card.timing}</span>`:''}
            ${
              card.astrology
                ? (card.astrology.sign
                    ? `<span class="px-2 py-1 rounded-full bg-white/10">♈︎ ${card.astrology.sign}</span>`
                    : `<span class="px-2 py-1 rounded-full bg-white/10">☿ ${card.astrology.planet}</span>`)
                : ''
            }
            ${card.numerology?.number!=null?`<span class="px-2 py-1 rounded-full bg-white/10">No. ${card.numerology.number}</span>`:''}
          </div>
        </div>
        <div class="text-left space-y-4">
          <div>
            <h3 class="font-bold text-xl text-fuchsia-300">ความหมายทั่วไป</h3>
            <p><strong class="text-white/90">ไพ่ตั้งตรง:</strong> <span class="text-white/80">${card.upright_general}</span></p>
            <p><strong class="text-white/90">ไพ่กลับหัว:</strong> <span class="text-white/80">${card.reversed_general}</span></p>
          </div>
          <hr class="border-white/20">
          <div>
            <h3 class="font-bold text-xl text-pink-300">ความรัก</h3>
            <p><strong class="text-white/90">ไพ่ตั้งตรง:</strong> <span class="text-white/80">${card.upright_love}</span></p>
            <p><strong class="text-white/90">ไพ่กลับหัว:</strong> <span class="text-white/80">${card.reversed_love}</span></p>
          </div>
          <hr class="border-white/20">
          <div>
            <h3 class="font-bold text-xl text-sky-300">การงาน</h3>
            <p><strong class="text-white/90">ไพ่ตั้งตรง:</strong> <span class="text-white/80">${card.upright_work}</span></p>
            <p><strong class="text-white/90">ไพ่กลับหัว:</strong> <span class="text-white/80">${card.reversed_work}</span></p>
          </div>
          <hr class="border-white/20">
          <div>
            <h3 class="font-bold text-xl text-emerald-300">การเงิน</h3>
            <p><strong class="text-white/90">ไพ่ตั้งตรง:</strong> <span class="text-white/80">${card.upright_finance}</span></p>
            <p><strong class="text-white/90">ไพ่กลับหัว:</strong> <span class="text-white/80">${card.reversed_finance}</span></p>
          </div>
          <hr class="border-white/20">
          <div>
            <h3 class="font-bold text-xl text-amber-300">คำแนะนำ</h3>
            <p><strong class="text-white/90">ตั้งตรง:</strong> <span class="text-white/80">${card.advice_upright||'-'}</span></p>
            <p><strong class="text-white/90">กลับหัว:</strong> <span class="text-white/80">${card.advice_reversed||'-'}</span></p>
          </div>
        </div>`;
      modal.style.display='flex'; setTimeout(()=>modal.style.opacity=1,10);
    }
    function closeModal(){ modal.style.opacity=0; setTimeout(()=>modal.style.display='none',300); }

    // 6) Events
    filterContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('button.filter-btn');
      if(!btn) return;
      document.querySelector('.filter-btn.active')?.classList.remove('active');
      btn.classList.add('active');
      renderCards(btn.dataset.filter);
    });
    modalCloseBtn.addEventListener('click', closeModal);
    document.getElementById('card-modal').addEventListener('click', (e)=>{ if(e.target.id==='card-modal') closeModal(); });
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && modal.style.display==='flex') closeModal(); });

    // 7) First render
    renderCards();
  </script>
</body>
</html>
